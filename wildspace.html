<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPERIAL MAINFRAME // VTT - RAKATA PRIME</title>
  <!-- Supabase CDN & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --bg-panel: #11141a;
      --bg-border: #1e2633;
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.15);
      --red: #ff3b30;
      --red-dim: rgba(255, 59, 48, 0.2);
      --yellow: #ffd60a;
      --green: #30d158;
      --purple: #bf5af2;
      --blue: #0a84ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* CRT Scanline Overlay */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Top Navigation HUD */
    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--bg-border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      z-index: 100;
    }
    .hud-title { font-weight: bold; color: var(--cyan); letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
    .hud-nav { display: flex; gap: 10px; align-items: center; }

    /* Button Styles */
    .btn {
      background: var(--bg-dark);
      border: 1px solid var(--bg-border);
      color: var(--text-main);
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 8px var(--cyan-dim); }
    .btn-red { border-color: var(--red); color: var(--red); }
    .btn-red:hover { background: var(--red-dim); }
    .btn-active { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }

    /* Main Container Layout */
    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    /* Left Sidebar: WebRTC Audio/Video & Comm Links */
    .comm-sidebar {
      background: var(--bg-panel);
      border-right: 2px solid var(--bg-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
    }
    .video-card {
      background: var(--bg-dark);
      border: 1px solid var(--bg-border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .video-card.speaking { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .video-frame {
      width: 100%;
      height: 140px;
      background: #000;
      position: relative;
    }
    .video-frame video { width: 100%; height: 100%; object-fit: cover; }
    .video-badge {
      position: absolute;
      bottom: 4px; left: 4px;
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      font-size: 10px;
      border-left: 2px solid var(--cyan);
    }
    .video-controls {
      display: flex;
      justify-content: space-around;
      padding: 6px;
      background: var(--bg-panel);
      border-top: 1px solid var(--bg-border);
    }

    /* Center Stage: Interactive Map & Token Overlay */
    .viewport {
      position: relative;
      background: #050608;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .combat-tracker {
      background: rgba(17, 20, 26, 0.95);
      border-bottom: 1px solid var(--bg-border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
    }
    .initiative-slots { display: flex; gap: 6px; flex-grow: 1; overflow-x: auto; }
    .slot-pill {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid var(--bg-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .slot-pill.pc { border-color: var(--cyan); background: var(--cyan-dim); color: var(--cyan); }
    .slot-pill.npc { border-color: var(--red); background: var(--red-dim); color: var(--red); }
    .slot-pill.active { outline: 2px solid #fff; font-weight: bold; }

    .map-container {
      position: relative;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
    }
    .map-canvas, .fog-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .hotspot {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.2);
      border: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      cursor: pointer;
      animation: pulse 2s infinite;
      z-index: 10;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 12px var(--cyan); } 100% { transform: scale(1); } }

    .token {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
