<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maker Skill Tree – Flyttet</title>
  <meta http-equiv="refresh" content="4;url=https://fablabskanderborg.dk/makerskilltree/index.html">
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --active-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      background: radial-gradient(circle at center, #131f3f 0%, #0b1329 100%);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .redirect-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .icon-wrap {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 25px 0;
    }

    .btn {
      background: var(--accent-blue);
      color: #0f172a;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      display: inline-block;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .btn:hover {
      background: #7dd3fc;
      transform: scale(1.02);
    }

    .countdown {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="icon-wrap">🚀</div>
    <h1>MAKER SKILL TREE ER FLYTTET</h1>
    <p>Maker Skill Tree er nu flyttet til en ny adresse. Husk at opdatere dit bogmærke.</p>
    
    <a href="https://fablabskanderborg.dk/makerskilltree/index.html" class="btn">
      Klik her for at komme til den nye side ➔
    </a>

    <div class="countdown">
      Du omdirigeres automatisk om <span id="timer">4</span> sekunder...
    </div>
  </div>

  <script>
    let timeLeft = 4;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerEl.innerText = timeLeft;
      } else {
        clearInterval(interval);
        window.location.href = 'https://fablabskanderborg.dk/makerskilltree/index.html';
      }
    }, 1000);
  </script>

</body>
</html>
